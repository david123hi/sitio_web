<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff9a9e" />
      <stop offset="100%" stop-color="#fecfef" />
    </linearGradient>
    <linearGradient id="brick" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc4749" />
      <stop offset="100%" stop-color="#7f4f24" />
    </linearGradient>
    <linearGradient id="fireLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky2)" />
  <!-- Montañas fondo -->
  <path d="M 0 150 Q 100 80 200 150 T 400 120 L 400 300 L 0 300 Z" fill="#606c38" opacity="0.4" />
  <!-- Edificio -->
  <rect x="50" y="130" width="300" height="170" fill="url(#brick)" />
  <rect x="40" y="110" width="320" height="20" fill="#582f0e" />
  <!-- Techo rústico -->
  <polygon points="30,110 200,50 370,110" fill="#9c6644" />
  <!-- Letrero -->
  <rect x="120" y="115" width="160" height="35" fill="#fefae0" rx="4" />
  <text x="200" y="138" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#7f4f24" text-anchor="middle">El Fogón del Valle</text>
  <!-- Puerta ancha -->
  <rect x="150" y="180" width="100" height="120" fill="#582f0e" />
  <path d="M 150 180 Q 200 150 250 180" fill="#582f0e" />
  <!-- Ventanas con luz cálida (fuego) -->
  <rect x="70" y="180" width="60" height="70" fill="url(#fireLight)" rx="5" />
  <rect x="270" y="180" width="60" height="70" fill="url(#fireLight)" rx="5" />
  <line x1="100" y1="180" x2="100" y2="250" stroke="#582f0e" stroke-width="4" />
  <line x1="70" y1="215" x2="130" y2="215" stroke="#582f0e" stroke-width="4" />
  <line x1="300" y1="180" x2="300" y2="250" stroke="#582f0e" stroke-width="4" />
  <line x1="270" y1="215" x2="330" y2="215" stroke="#582f0e" stroke-width="4" />
</svg>