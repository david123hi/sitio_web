<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe5b4" />
      <stop offset="100%" stop-color="#ffcc80" />
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#81b29a" opacity="0.4" />
  <!-- Casa colonial -->
  <rect x="40" y="120" width="320" height="180" fill="url(#wall)" />
  <!-- Techo tejas -->
  <path d="M 20 120 L 200 40 L 380 120 Z" fill="#e07a5f" />
  <path d="M 60 120 L 200 60 L 340 120 Z" fill="#d95d39" />
  <!-- Letrero madera tallada -->
  <rect x="110" y="130" width="180" height="40" fill="#5c4033" rx="10" />
  <text x="200" y="156" font-family="'Comic Sans MS', cursive, sans-serif" font-size="16" fill="#f4f1de" text-anchor="middle">Sabores de la Abuela</text>
  <!-- Puerta cálida -->
  <rect x="160" y="200" width="80" height="100" fill="#6b705c" rx="4" />
  <!-- Ventanas con maceteros -->
  <rect x="70" y="190" width="60" height="60" fill="#f4f1de" stroke="#5c4033" stroke-width="4" />
  <line x1="100" y1="190" x2="100" y2="250" stroke="#5c4033" stroke-width="4" />
  <rect x="65" y="255" width="70" height="15" fill="#e07a5f" /> <!-- macetero -->
  <circle cx="80" cy="250" r="8" fill="#e63946" />
  <circle cx="100" cy="250" r="8" fill="#a8dadc" />
  <circle cx="120" cy="250" r="8" fill="#e63946" />
  
  <rect x="270" y="190" width="60" height="60" fill="#f4f1de" stroke="#5c4033" stroke-width="4" />
  <line x1="300" y1="190" x2="300" y2="250" stroke="#5c4033" stroke-width="4" />
  <rect x="265" y="255" width="70" height="15" fill="#e07a5f" /> <!-- macetero -->
  <circle cx="280" cy="250" r="8" fill="#e63946" />
  <circle cx="300" cy="250" r="8" fill="#a8dadc" />
  <circle cx="320" cy="250" r="8" fill="#e63946" />
</svg>