{% if user.is_authenticated %}
<li class="nav-item d-flex align-items-center me-2">
  <span class="navbar-text text-white-50">
    {{ user.get_full_name|default:user.username }}
    <span class="badge bg-warning text-dark">{{ rol_usuario|default:"Sin perfil" }}</span>
  </span>
</li>
<li class="nav-item">
  <form method="post" action="{% url 'cuentas:logout' %}" class="d-inline">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-outline-light">Cerrar sesión</button>
  </form>
</li>
{% else %}
<li class="nav-item"><a class="nav-link" href="{% url 'cuentas:login' %}">Iniciar sesión</a></li>
{% endif %}
