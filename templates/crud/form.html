{% extends 'base_gestion.html' %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm form-card">
            <div class="form-card-head">
                <span class="ico"><i class="bi bi-pencil-square"></i></span>
                <div>
                    <h1>{{ titulo }}</h1>
                    <p>Completa los datos y guarda los cambios.</p>
                </div>
            </div>
            <form method="post" novalidate>
                {% csrf_token %}
                {% include 'partials/form_fields.html' with form=form %}
                <div class="d-flex gap-2 pt-2">
                    <button type="submit" class="btn btn-success"><i class="bi bi-check2-circle"></i> Guardar</button>
                    <a href="{{ url_cancelar }}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
