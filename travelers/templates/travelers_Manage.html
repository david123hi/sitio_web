{% extends 'travelers_Base.html' %}
{% block titulo %} {{viaje.actividad}} {% endblock %}
{% block contenido %}
<header class="tn-detail-header">
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Viajes disponibles</h2>
    <a href="#" class = "btn btn-success">+ Añadir viajero</a>
</div>
</header>
<table class="table table-hover bg-white shadow-sm">
    <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Correo</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        {% for viajero in viajeros %}
        <tr>
            <td>{{viajero.nombre}}</td>
            <td>{{viajero.correo}}</td>
            <td class="d-flex gap-2">
                <a href="#" class="btn btn-sm btn-outline-primary">Modificar</a>
                <a href="#" class="btn btn-sm btn-outline-danger">Eliminar</a>
            </td>
            {%endfor%}
        </tr>
    </tbody>
</table>
{% endblock %}
