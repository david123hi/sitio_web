{% extends 'travelers_Base.html' %}
{% block titulo %}Eliminar participación{% endblock %}
{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h2 class="h4 mb-3">Eliminar participación</h2>
                <p>¿Seguro que deseas quitar a <strong>{{ participacion.viajero }}</strong> del viaje <strong>{{ viaje.actividad }}</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                        <a href="{% url 'travelers:detalle_viaje' viaje.id %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
